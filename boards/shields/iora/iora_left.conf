# DYA Studio: editable combos live on the central half only.
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# Eleven stock combos, plus five empty slots for user-defined combos.
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_PMW3610_STUDIO_RPC=y

# Custom-subsystem handlers and the enlarged split-command union need more
# than the base firmware's RPC / split-workqueue defaults.
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
