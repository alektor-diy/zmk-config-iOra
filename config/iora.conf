CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
CONFIG_PMW3610_SMART_ALGORITHM=y
# The DYA driver uses Kconfig defaults for orientation on both sensors.
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y

# Report sensor state and settings for both halves through the central.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096

# Custom RPC and 240-byte split events add nested callbacks to the normal
# key/motion path. Keep headroom in the shared queues on BOTH halves.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=2048
# Emit .su files at build time; this does not run a profiler on the device.
CONFIG_STACK_USAGE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_BT_BAS=y
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
# Initial battery thresholds, pending measurement on iOra.
CONFIG_ZMK_NON_LIPO_MIN_MV=1100
CONFIG_ZMK_NON_LIPO_MAX_MV=1400
CONFIG_ZMK_NON_LIPO_LOW_MV=1050
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=300000

CONFIG_ZMK_SATELLITE=y
